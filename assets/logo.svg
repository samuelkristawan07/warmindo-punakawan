<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7BE" />
      <stop offset="50%" stop-color="#D4A857" />
      <stop offset="100%" stop-color="#AA7E2F" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0B1A1E" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Outer Decorative Ring -->
  <circle cx="50" cy="50" r="46" fill="#1E3F47" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Stylized Letter P -->
  <path d="M 36 24 
           L 54 24 
           C 66 24, 73 31, 73 41 
           C 73 51, 65 58, 54 58 
           L 46 58 
           L 46 76 
           L 36 76 Z 
           M 46 33 
           L 46 49 
           L 53 49 
           C 59 49, 63 46, 63 41 
           C 63 36, 59 33, 53 33 Z" 
        fill="url(#goldGrad)" 
        filter="url(#shadow)"/>
  <!-- Decorative small diamond -->
  <polygon points="50,11 52,14 50,17 48,14" fill="url(#goldGrad)"/>
  <polygon points="50,83 52,86 50,89 48,86" fill="url(#goldGrad)"/>
  <polygon points="11,50 14,48 17,50 14,52" fill="url(#goldGrad)"/>
  <polygon points="83,50 86,48 89,50 86,52" fill="url(#goldGrad)"/>
</svg>

